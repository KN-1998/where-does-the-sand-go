# params.yaml — 参数登记（阶段 2 交付物）
# 字段: symbol / name / unit / value / range / source_type / evidence_id / calibrate / note
# source_type: OBS（观测/公开资料）| MODEL（由物理关系或模型导出）| ASSUME（假设，必须给理由与范围）
# calibrate: true = 参与标定；false = 固定为先验值；"sens" = 仅做敏感性
# evidence_id 对应 ledger/claims.csv 的 id
meta:
  version: "0.2"
  date: "2026-11-09"
  units: "SI (m, m^2, m^3, yr, s)"
  author: "modeling-agent"

domain:
  L_corridor: {value: 5000.0, unit: m, source_type: ASSUME, evidence_id: A-01, note: "题面给定的代表性 5 km 走廊（竞赛假设，非政府规划区）"}
  L_buffer:   {value: 2000.0, unit: m, source_type: ASSUME, evidence_id: A-02, note: "两侧各留 2 km 缓冲，计算域共 9 km；理由见 建议.txt"}
  x_hotspot:  {value: 0.0,    unit: m, source_type: ASSUME, evidence_id: A-03, note: "热点中心置于走廊中央 x=0；真实位置待数据确认"}
  T_sim:      {value: 15.0,   unit: yr, source_type: OBS,     evidence_id: Q-01, note: "2027–2042（题面给定）"}

geometry:
  h_star: {symbol: "h_*", name: "闭合深度", unit: m, value: 8.0, range: [6.0, 10.0], source_type: MODEL, evidence_id: M-01, calibrate: sens, note: "中等能量障壁岛典型 6–10 m"}
  B_berm: {symbol: "B",   name: "滩肩高度", unit: m, value: 2.0, range: [1.5, 2.5], source_type: ASSUME, evidence_id: A-04, calibrate: sens, note: "外滩典型滩肩 1.5–2.5 m"}
  H_dep:  {symbol: "H",   name: "岸线-体积换算深度 h_*+B", unit: m, value: 10.0, range: [8.0, 12.0], source_type: MODEL, evidence_id: M-01, calibrate: false, note: "由 h_star + B_berm 导出；1 m 岸线 <=> 10 m^3/m 沙"}
  A_dean: {symbol: "A",   name: "Dean 平衡剖面参数", unit: "m^(1/3)", value: 0.10, range: [0.08, 0.12], source_type: OBS, evidence_id: O-08, calibrate: false, note: "对应 D50 ~0.2 mm 的中砂"}
  D50:    {symbol: "D_50", name: "中值粒径", unit: mm, value: 0.20, range: [0.15, 0.30], source_type: OBS, evidence_id: O-08, calibrate: false, note: "外滩砂质海滩典型值"}

waves:
  Hs_mean: {symbol: "H_s", name: "平均有效波高", unit: m, value: 1.3, range: [1.0, 1.6], source_type: OBS, evidence_id: O-09, calibrate: false}
  Tp_mean: {symbol: "T_p", name: "平均谱峰周期", unit: s, value: 8.5, range: [7.0, 10.0], source_type: OBS, evidence_id: O-09, calibrate: false}
  Hb:      {symbol: "H_b", name: "破碎波高（用于 D 的估算）", unit: m, value: 1.2, range: [1.0, 1.5], source_type: MODEL, evidence_id: M-02, calibrate: false, note: "由 H_s 与破碎指标 gamma_b=0.78 估算"}
  K_cerc:  {symbol: "K_c", name: "CERC 输沙系数", unit: dimensionless, value: 0.39, range: [0.2, 0.8], source_type: OBS, evidence_id: O-10, calibrate: false, note: "SPM 口径（H_s 时为 0.39；H_rms 时约 0.77）"}
  alpha_b: {symbol: "alpha_b", name: "特征破碎波入射角", unit: deg, value: 8.0, range: [0.0, 15.0], source_type: ASSUME, evidence_id: A-05, calibrate: false, note: "线性化用；cos(2a) 在 0-15 deg 内变化很小"}

transport:
  D_diff: {symbol: "D", name: "岸线扩散系数", unit: "m^2/yr", value: 300000.0, range: [100000.0, 800000.0], source_type: MODEL, evidence_id: M-02, calibrate: "锚定", note: "D = 2 K_c H_b^2.5 cos(2a)/H；核心参数，敏感性必须覆盖"}
  u_drift: {symbol: "u", name: "净沿岸漂移速度", unit: m/yr, value: 50.0, range: [0.0, 150.0], source_type: ASSUME, evidence_id: A-06, calibrate: true, note: "弱可辨识；与 D 通过'重心位移 vs 二阶矩增长'分离"}
  rho_e:  {symbol: "rho_e", name: "长期平均岸线侵蚀率", unit: m/yr, value: 3.0, range: [0.9, 6.7], source_type: OBS, evidence_id: O-01, calibrate: "先验", note: "9-22 ft/yr => 2.7-6.7 m/yr；主算例取 3.0"}
  rho_e_hotspot_amp: {symbol: "a_h", name: "热点侵蚀率放大倍数", unit: dimensionless, value: 0.5, range: [0.0, 1.0], source_type: ASSUME, evidence_id: A-07, calibrate: true, note: "rho_e(x)=rho_0[1+a_h exp(-(x-x_h)^2/2 sigma_h^2)]"}
  sigma_h: {symbol: "sigma_h", name: "热点高斯宽度", unit: m, value: 600.0, range: [300.0, 1200.0], source_type: ASSUME, evidence_id: A-07, calibrate: false}

storm:
  lambda_s: {symbol: "lambda_s", name: "侵蚀性事件到达率", unit: "1/yr", value: 0.4, range: [0.2, 0.8], source_type: ASSUME, evidence_id: A-08, calibrate: true, note: "仅计造成 >3 m 等效后退的事件；不是全部风暴"}
  dy_ref:   {symbol: "dy_ref", name: "单事件等效后退中位值", unit: m, value: 8.0, range: [4.0, 12.0], source_type: ASSUME, evidence_id: A-09, calibrate: true}
  dy_p95:   {symbol: "dy_95", name: "单事件等效后退 95 分位", unit: m, value: 25.0, range: [15.0, 40.0], source_type: ASSUME, evidence_id: A-09, calibrate: false}
  gamma_s:  {symbol: "gamma", name: "强度-侵蚀非线性指数", unit: dimensionless, value: 1.5, range: [1.0, 2.0], source_type: ASSUME, evidence_id: A-10, calibrate: false}
  w_sat:    {symbol: "w_s", name: "侵蚀饱和滩宽尺度", unit: m, value: 20.0, range: [10.0, 40.0], source_type: ASSUME, evidence_id: A-10, calibrate: false, note: "S_k 中 [1-exp(-w/w_s)] 因子"}
  k_rec:    {symbol: "k", name: "沙坝回滩恢复率", unit: "1/yr", value: 0.667, range: [0.33, 2.0], source_type: OBS, evidence_id: O-11, calibrate: true, note: "对应恢复时间 0.5-3 yr"}
  lam_off:  {symbol: "lambda", name: "近岸沙库永久离岸损失率", unit: "1/yr", value: 0.1, range: [0.02, 0.3], source_type: ASSUME, evidence_id: A-11, calibrate: true, note: "对应 10 yr 损失时间"}

beach_state:
  w0_mean: {symbol: "w_0", name: "初始干滩宽度（走廊均值）", unit: m, value: 25.0, range: [15.0, 40.0], source_type: ASSUME, evidence_id: A-12, calibrate: false, note: "无实测剖面数据；必须做敏感性并在论文标明 ASSUME"}
  w0_min:  {symbol: "w_min", name: "初始干滩宽度（最窄处）", unit: m, value: 16.0, range: [8.0, 22.0], source_type: ASSUME, evidence_id: A-12, calibrate: false}
  d_bldg:  {symbol: "d_b", name: "建筑退距（距基准 MHW 线）", unit: m, value: 30.0, range: [20.0, 45.0], source_type: ASSUME, evidence_id: A-13, calibrate: false}
  m_safe:  {symbol: "m_s", name: "安全余量（爬高+不确定性）", unit: m, value: 8.0, range: [5.0, 12.0], source_type: ASSUME, evidence_id: A-13, calibrate: false}
  w_crit:  {symbol: "w_crit", name: "风险阈值滩宽 = d_b - m_s", unit: m, value: 20.0, range: [12.0, 32.0], source_type: MODEL, evidence_id: M-03, calibrate: false}

management:
  V_max:  {symbol: "V_max", name: "15 年总沙量上限", unit: "m^3", value: 1500000.0, range: [500000.0, 3000000.0], source_type: MODEL, evidence_id: M-04, calibrate: "敏感性", note: "由 Dare County 侵蚀量 300k cy/yr 量级缩放到 5 km 走廊"}
  c0:     {symbol: "c_0", name: "单次工程固定成本", unit: "USD", value: 8000000.0, range: [3000000.0, 15000000.0], source_type: ASSUME, evidence_id: A-14, calibrate: false, note: "mobilisation/审批/监测；无该项则'多 vs 少'比较失效"}
  c1:     {symbol: "c_1", name: "单位方量成本", unit: "USD/m^3", value: 33.0, range: [20.0, 46.0], source_type: OBS, evidence_id: O-12, calibrate: false, note: "约 25 USD/cy；区间由 15-35 USD/cy 换算"}
  C_max:  {symbol: "C_max", name: "15 年总预算上限", unit: "USD", value: 60000000.0, range: [25000000.0, 100000000.0], source_type: MODEL, evidence_id: M-04, calibrate: false, note: "c0 + c1*V_max 的数量级自洽"}
  w_trig: {symbol: "w_trig", name: "触发评估的滩宽阈值", unit: m, value: 25.0, source_type: MODEL, evidence_id: M-05, calibrate: false, note: "w_crit + delta, delta=5 m"}
  T_min:  {symbol: "T_min", name: "可接受的最短保护期（低于则考虑撤退）", unit: yr, value: 3.0, range: [2.0, 5.0], source_type: ASSUME, evidence_id: A-15, calibrate: false}

climate_scenarios:
  slr_base: {symbol: "R_SLR", name: "相对海平面上升速率（基准）", unit: "mm/yr", value: 4.3, range: [3.0, 5.5], source_type: OBS, evidence_id: O-13, calibrate: false, note: "NOAA 潮位站量级；仅用于 S3 情景输入，不得直接换算为岸线后退"}
  slr_2027: {symbol: "R_SLR,2027", name: "S3 情景初期速率", unit: "mm/yr", value: 4.0, source_type: ASSUME, evidence_id: A-16, calibrate: false}
  slr_2042: {symbol: "R_SLR,2042", name: "S3 情景末期速率", unit: "mm/yr", value: 8.0, source_type: ASSUME, evidence_id: A-16, calibrate: false}
  Hs_trend: {symbol: "dHs/dt", name: "S3 情景波高趋势", unit: "%/decade", value: 3.0, range: [0.0, 6.0], source_type: ASSUME, evidence_id: A-16, calibrate: false}

scenarios:
  S1_calm: {lambda_s: 0.2, dy_ref: 6.0, rho_e: 2.5, slr: 4.0}
  S2_storm_soon: {lambda_s: 0.4, dy_ref: 8.0, rho_e: 3.0, slr: 4.3, forced_event_at: 0.5, forced_dy: 25.0}
  S3_repeat: {lambda_s: [0.4, 0.8], dy_ref: [8.0, 11.0], rho_e: [3.0, 5.0], slr: [4.0, 8.0], Hs_trend: 3.0}

numerics:
  dx:  {value: 25.0, unit: m, note: "沿 9 km 计算域约 360 个单元"}
  dt:  {value: 0.02, unit: yr, note: "隐式格式可用；显式需满足 D*dt/dx^2 <= 0.5"}
  scheme: {value: "conservative FV + backward Euler", note: "见 CODER_SPEC §2"}
  rtol: {value: 1.0e-6, note: "沙量收支闭合相对残差阈值"}
