[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sandgo"
version = "0.1.0"
description = "Where does the sand go? 1-D shoreline sand-budget model (MCM-style practice problem)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "PyYAML>=6", "pandas>=2", "matplotlib>=3.7"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["sim", "exp", "viz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
